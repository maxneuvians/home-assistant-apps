worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    # Ingress URLs contain session tokens. Do not record them in access logs.
    access_log off;
    server {
        listen 8099;
        allow 172.30.32.2;
        deny all;
        location = / {
            root /app;
            try_files /index.html =404;
        }
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host 127.0.0.1:8080;
            proxy_set_header Accept-Encoding identity;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_redirect http://127.0.0.1:8080/ $http_x_ingress_path/;
            proxy_redirect ~^(/VirtualRadar.*)$ $http_x_ingress_path$1;
            proxy_cookie_path /VirtualRadar $http_x_ingress_path/VirtualRadar;
            # VRS primarily uses relative URLs. Preserve the Ingress prefix for
            # root-relative links emitted by the server or its plugins as well.
            sub_filter_once off;
            sub_filter_types text/css application/javascript application/json;
            sub_filter '"/VirtualRadar/' '"$http_x_ingress_path/VirtualRadar/';
            sub_filter "'/VirtualRadar/" "'$http_x_ingress_path/VirtualRadar/";
        }
    }
}
